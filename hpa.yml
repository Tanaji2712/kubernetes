apiVersion: autoscaling/v2
kind: HorizontalPodAutoscalar
metadata:
  name: frontend-hpa
  namespace: workshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend

    minReplicas: 2
    maxReplicas: 10

    metrics:
    - type: Resources

      resource:
        name: cpu

        target:
          type: utilization
          averageUtization: 70
